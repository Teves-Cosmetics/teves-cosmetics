<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teves | لوحة التحكم</title>
  <style>
    :root{--wine:#5e002d;--bean:#3d0c02;--cream:#f8f3ed;--paper:#fffdf9;--muted:#766964;--line:#eadfd5;--gold:#b89a68}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--bean);font-family:Arial,"Segoe UI",sans-serif}
    header{background:var(--wine);color:#fff;padding:22px 5vw;display:flex;justify-content:space-between;align-items:center;gap:20px}header h1{margin:0;font-size:25px}header small{opacity:.8}
    main{width:min(1180px,90%);margin:32px auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}.toolbar h2{margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}
    button{border:0;border-radius:10px;padding:11px 17px;cursor:pointer;font:inherit}.primary{background:var(--wine);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--wine)}
    .notice{padding:14px 18px;background:#fff8e8;border:1px solid #edd9a5;border-radius:12px;margin-bottom:22px;color:#72551a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px #3d0c0210}.card-media{height:170px;background:linear-gradient(135deg,#f4e5d9,#ead1c7);display:grid;place-items:center;color:var(--wine);font-size:28px;font-weight:700}.card-body{padding:18px}.tag{color:var(--wine);font-size:12px;font-weight:700}.card h3{margin:6px 0;font-size:18px}.price{font-weight:700}.muted{color:var(--muted);font-size:13px}.card-actions{display:flex;gap:8px;margin-top:15px}.empty{padding:55px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
    @media(max-width:600px){header{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}}
    .category-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}.category-row small{color:var(--muted);margin-left:auto}.category-list{display:grid;gap:24px;margin-bottom:28px}.category-block{background:#fffaf6;border:1px solid var(--line);border-radius:18px;padding:18px}.category-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}.category-heading h2{margin:0;color:var(--wine);font-size:22px}.category-heading small{color:var(--muted)}.category-actions{display:flex;gap:8px;flex-wrap:wrap}.category-block .grid{background:transparent}
  </style>
</head>
<body>
  <header><div><h1>TEVES</h1><small>لوحة إدارة المنتجات والعروض</small></div><button class="secondary" id="logoutBtn" hidden>تسجيل الخروج</button></header>
  <main>
    <section id="loginPanel" class="empty" style="max-width:460px;margin:60px auto"><h2>دخول الإدارة</h2><p class="muted">استخدم بريد الإدارة وكلمة المرور من Supabase.</p><input id="loginEmail" type="email" value="ahmedworkkkk@gmail.com" placeholder="البريد الإلكتروني" style="width:100%;padding:13px;margin:8px 0;border:1px solid var(--line);border-radius:9px"><input id="loginPassword" type="password" placeholder="كلمة المرور" style="width:100%;padding:13px;margin:8px 0;border:1px solid var(--line);border-radius:9px"><button class="primary" id="loginBtn">دخول</button><p id="loginError" style="color:#a22"></p></section>
    <section id="dashboardPanel" hidden>
    <div class="notice" id="setupNotice">هذه نسخة البداية. بعد إنشاء مشروع Supabase ووضع بيانات الاتصال في <code>config.js</code> ستتحول البيانات من تجريبية إلى قاعدة بيانات حقيقية.</div>
    <div class="toolbar"><h2>الأقسام</h2><div class="actions"><button class="primary" id="addCategoryBtn">+ إضافة قسم</button></div></div>
    <section class="category-list" id="categoriesGrid"></section>
    <div class="toolbar"><h2>المنتجات</h2><div class="actions"><button class="primary" id="addBtn">+ إضافة منتج</button></div></div>
    <section class="grid" id="productsGrid"></section></section>
  </main>
  <dialog id="productDialog"><form method="dialog" id="productForm" style="min-width:min(520px,85vw);padding:24px;border:0;border-radius:16px"><h2 id="formTitle">إضافة منتج</h2><input type="hidden" id="productId"><label>اسم المنتج<input id="productName" required style="width:100%;padding:10px;margin:5px 0 12px"></label><label>الرابط المختصر<input id="productSlug" required style="width:100%;padding:10px;margin:5px 0 12px"></label><label>القسم<select id="productCategory" style="width:100%;padding:10px;margin:5px 0 12px"><option value="skincare">العناية بالبشرة</option><option value="haircare">العناية بالشعر</option><option value="beauty">الجمال</option><option value="natural">طبيعي</option></select></label><label>الوصف المختصر<textarea id="productDescription" style="width:100%;padding:10px;margin:5px 0 12px"></textarea></label><label>التفاصيل (كل تفصيلة في سطر)<textarea id="productDetails" style="width:100%;padding:10px;margin:5px 0 12px"></textarea></label><label>مناسب لمن<textarea id="productSuitable" style="width:100%;padding:10px;margin:5px 0 12px"></textarea></label><label>غير مناسب لمن<textarea id="productNotSuitable" style="width:100%;padding:10px;margin:5px 0 12px"></textarea></label><label>طريقة الاستخدام<textarea id="productUsage" style="width:100%;padding:10px;margin:5px 0 12px"></textarea></label><label>ملاحظات<textarea id="productNotes" style="width:100%;padding:10px;margin:5px 0 12px"></textarea></label><label>السعر<input id="productPrice" type="number" min="0" step="0.01" style="width:100%;padding:10px;margin:5px 0 12px"></label><label>السعر قبل الخصم<input id="productOriginalPrice" type="number" min="0" step="0.01" style="width:100%;padding:10px;margin:5px 0 12px"></label><div style="display:flex;gap:10px;justify-content:flex-start"><button class="primary" value="default">حفظ</button><button class="secondary" type="button" id="cancelProductBtn">إلغاء</button></div></form></dialog>
  <script src="config.js"></script><script src="app.js"></script>
</body>
</html>
